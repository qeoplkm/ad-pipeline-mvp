<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio description</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h1>Audio description</h1>
<div id="status" class="status" role="status"></div>

<section id="attached" hidden>
  <p>Attached: <strong id="att-run"></strong> <span id="att-cues" class="muted"></span></p>
  <fieldset>
    <legend>While playing</legend>
    <label><input type="checkbox" id="u-audio"> Narration audio</label>
    <label><input type="checkbox" id="u-duck"> Lower video volume under narration</label>
    <label><input type="checkbox" id="u-overlay"> Show narration text</label>
    <label><input type="checkbox" id="u-announce"> Announce to screen reader</label>
  </fieldset>
  <button id="detach">Detach</button>
</section>

<section id="setup">
  <label for="run">Description run</label>
  <select id="run"><option>Loading…</option></select>
  <p id="run-info" class="muted small"></p>

  <label for="startAt">Description starts at video time (seconds)</label>
  <input type="number" id="startAt" value="0" step="0.1" min="0">
  <p class="muted small">Use 0 if the run was made from the start of this video.</p>

  <fieldset>
    <legend>Output</legend>
    <label><input type="checkbox" id="o-audio" checked> Narration audio</label>
    <label><input type="checkbox" id="o-duck" checked> Lower video volume under narration</label>
    <label><input type="checkbox" id="o-overlay" checked> Show narration text</label>
    <label><input type="checkbox" id="o-announce"> Announce to screen reader</label>
  </fieldset>

  <div class="row">
    <label for="duckDb">Duck depth <span id="duckDb-v">-9 dB</span>
      <input type="range" id="duckDb" min="-24" max="0" step="1" value="-9"></label>
    <label for="volume">Narration volume <span id="volume-v">100%</span>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1"></label>
  </div>

  <button id="attach" class="primary">Attach to this tab</button>
</section>

<details>
  <summary>Server</summary>
  <label for="server">Local server URL</label>
  <input type="url" id="server" value="http://127.0.0.1:8765">
  <p class="muted small">Start it with <code>.venv/bin/python -m webui.server</code> in the project folder.</p>
</details>
<script src="popup.js"></script>
</body>
</html>
