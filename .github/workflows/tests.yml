name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light dependencies (no torch, no models)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy srt pytest
      - name: Unit tests
        run: python -m pytest tests/unit -q
