[project]
name = "ad-pipeline-mvp"
version = "0.1.0"
description = "Automatic audio description (AD) for film clips: dialogue gaps -> key-frame grids -> multimodal LLM narration -> TTS -> ducked mix + WebVTT. English-first, Mandarin supported."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "librosa>=0.10",
    "soundfile",
    "opencv-python-headless",
    "scenedetect>=0.6.4",
    "edge-tts>=7.0",
    "pyrubberband",
    "torch",
    "torchaudio",
    "demucs>=4.0.1",
    "funasr>=1.2",
    "modelscope",
    "silero-vad",
    "google-genai",
    "anthropic",
    "openai",
    "srt",
    "tqdm",
    "pillow",
    "httpx",
]

[project.optional-dependencies]
whisperx = ["whisperx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adpipe"]
